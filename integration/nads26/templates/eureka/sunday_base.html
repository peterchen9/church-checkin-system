<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}主日聚會報到{% endblock %}｜北門行政平台</title>
<style>
:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#e5edf8;background:#0c1423;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #29374d;background:#111d30}nav{max-width:960px;margin:auto;padding:20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}nav strong{margin-right:auto}a{color:#93c5fd}main{max-width:880px;margin:36px auto;padding:0 20px}h1{font-size:30px;letter-spacing:.04em}p{line-height:1.7;color:#aabbd1}.panel{background:#152238;border:1px solid #2a3c56;border-radius:16px;padding:24px;margin:20px 0}label{display:block;margin-bottom:10px;font-weight:650}input,button{font:inherit;border-radius:8px;padding:12px;border:1px solid #4a6284}input{background:#0c1728;color:#fff;min-width:0}input:focus,button:focus,a:focus{outline:3px solid #93c5fd;outline-offset:3px}button{cursor:pointer;background:#2563eb;color:#fff;font-weight:650}button:disabled{opacity:.6;cursor:wait}.row{display:flex;gap:10px}.row input{flex:1}.result{padding:16px 0;border-top:1px solid #32415a;display:flex;gap:12px;align-items:center}.result div{flex:1}.result small{display:block;color:#b4c4d9;margin-top:6px}.notice{padding:16px;border-radius:10px;background:#23354f;line-height:1.7}.success{background:#104335;color:#cbffeb}.error{background:#5b2630;color:#ffe0e4}.small{font-size:14px}.dimensions{display:flex;gap:16px;flex-wrap:wrap}.dimensions input{width:110px}#status:empty{display:none}@media(max-width:540px){.row{flex-wrap:wrap}.row input{flex-basis:100%}.panel{padding:18px}.result{align-items:flex-start;flex-direction:column}}
</style>{% block head %}{% endblock %}</head>
<body><header><nav><strong>北門行政平台 · 主日報到</strong><a href="{% url 'eureka:sunday_checkin:home' %}">主日報到</a><a href="{% url 'eureka:sunday_checkin:barcodes' %}">列印條碼</a><a href="{% url 'eureka:eureka' %}">通訊錄</a></nav></header>
<main>{% block content %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
