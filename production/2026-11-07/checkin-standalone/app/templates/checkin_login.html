<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能報到系統登入</title>
<style>body{font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#eef4ff;color:#172033;margin:0;display:grid;min-height:100vh;place-items:center}.card{background:white;border-radius:20px;box-shadow:0 12px 40px #1d4ed122;padding:32px;width:min(360px,80vw)}input,button{font:inherit;box-sizing:border-box;padding:12px;border-radius:8px;width:100%;margin:10px 0;border:1px solid #cbd5e1}button{background:#2563eb;color:white;cursor:pointer}label{display:block}.error{color:#b91c1c}a{color:#2563eb}</style></head>
<body><main class="card"><h1>北門報到系統</h1><p>請輸入智能報到系統密碼。</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label for="password">密碼</label><input id="password" name="password" type="password" required autofocus autocomplete="current-password"><button>{% if is_backend %}登入主日報到記錄{% else %}登入報到系統{% endif %}</button></form>{% if is_backend %}<a href="http://192.168.16.240:8033/admin.html?tab=sunday-records" target="_top">返回報到系統後台</a>{% else %}<a href="/">返回完整報到首頁</a>{% endif %}</main></body></html>
