<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <script src="/admin-entry.js?v=20261027-simple-url"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>報到系統後台登入</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-light: #F3F4F6;
            --white: #FFFFFF;
        }
        body {
            margin: 0; padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-light);
            font-family: 'Noto Sans TC', sans-serif;
        }
        .login-card {
            background: var(--white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        .login-card h2 {
            margin-top: 0;
            color: #1F2937;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #D1D5DB;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        .btn:hover {
            background: var(--primary-hover);
        }
    *{box-sizing:border-box}body{min-height:100dvh;height:auto;padding:16px}.login-card{width:min(100%,430px);padding:clamp(24px,6vw,40px)}</style>
</head>
<body>
    <div class="login-card">
        <h2>👑 報到系統後台登入</h2>
        <div class="form-group">
            <label>管理員密碼</label>
            <input type="password" id="password" placeholder="請輸入密碼" onkeypress="if(event.key==='Enter') login()">
        </div>
        <button class="btn" onclick="login()">登入</button>
    </div>

    <script>
        async function login() {
            const password = document.getElementById('password').value;
            if (!password) return alert('請輸入密碼');
            
            const res = await fetch('api/login.php', {
                method: 'POST',
                cache: 'no-store',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'login', password })
            });
            const data = await res.json();
            
            if (data.success) {
                const page = await fetch('admin.html', { cache: 'reload' });
                const html = await page.text();
                if (!page.ok || !html.includes('data-admin-version="20261027-show-sunday"') || !html.includes('sunday-records-frame') || !html.includes('主日報到記錄')) {
                    alert('後台版本讀取不完整，請重新開啟正式登入頁後再試。');
                    return;
                }
                window.location.replace('http://192.168.16.240:8033/admin.html');
            } else {
                alert(data.message);
            }
        }
    </script>
</body>
</html>
